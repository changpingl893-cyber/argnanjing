<!DOCTYPE html>
<html lang="zh-CN" data-theme="redblue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线索板 · 古时今日</title>
<link rel="stylesheet" href="css/theme.css?v=20260912">
<link rel="stylesheet" href="css/board.css?v=20260912">
<link rel="stylesheet" href="css/fonts.css?v=20260912">
</head>
<body class="board-page">

<div class="board" id="board">
  <div class="board-bg" aria-hidden="true">
    <div class="bg-watermark">古时今日</div>
    <div class="chalk chalk-1">这条线对不上 ——</div>
    <div class="chalk chalk-2">最后一次上线：8 月 28 日</div>
    <div class="chalk chalk-3">余额 0 / 无人认领</div>
  </div>

  <div class="board-head">
    <div class="board-title">文物档案</div>
    <div class="board-rule"><i></i><i></i><i></i></div>
    <div class="board-sub">主线索 <b id="card-count">0</b> 条 · 点开看大图 · 双击翻面看背面的字</div>
  </div>
  <div class="board-actions">
    <a href="index.html">重新看开场</a>
    <a href="#" id="rel-toggle">显示/隐藏连线</a>
  </div>

  <svg id="lines"></svg>
  <div id="pins"></div>

  <div class="board-legend">
    <span class="lg-tip">正面是照片 · <b>双击翻过来</b>看背面写的字</span>
  </div>
</div>

<!-- 看大图 / 翻面 -->
<div class="lb" id="lb">
  <span class="lb-index" id="lb-index">— / —</span>
  <button class="lb-close" id="lb-close">✕</button>

  <div class="lb-stage" id="lb-stage">
    <div class="lb-card">
      <div class="lb-face lb-front"><img id="lb-img" alt=""></div>
      <div class="lb-face lb-back">
        <div class="lb-name" id="lb-name">—</div>
        <div class="lb-meta">
          <div class="lb-row"><span>年 代</span><b id="lb-era">—</b></div>
          <div class="lb-row"><span>来 源</span><b id="lb-source">—</b></div>
          <div class="lb-row"><span>现 状</span><b id="lb-state">—</b></div>
        </div>
        <div class="lb-note" id="lb-note"></div>
        <div class="lb-stamp">存 档</div>
      </div>
    </div>
  </div>

  <div class="lb-bar">
    <button id="lb-prev">‹</button>
    <span class="lb-tip">双击图片 <b>翻面</b> · ← → 换一张 · Esc 关闭</span>
    <button id="lb-next">›</button>
  </div>
</div>

<script src="js/archive-data.js?v=20260912"></script>
<script src="js/board.js?v=20260912"></script>
</body>
</html>
