  <img class="ph-img" src="assets/old_photo2.jpg" alt="旧合影（2016.12 南京博物院前）">
  <p class="ph-note">
    2016.12 · 我们四个人。第一次，也是唯一一次聚齐。<br><br>
    站得整整齐齐。那天青瓷说：照片背后那栋楼像是南京博物院，可我们谁也没进去过。
    后来人渐渐多了，又渐渐少了，再没凑齐过这四个人。<br><br>
    照片右下角有一行字：<b>2017.12.28</b> —— 那不是合影的日子。<br>
    2017 年 12 月 28 日，是这个号里<b>最后还有人的一天</b>。三天之后，守夜人发了最后一篇，
    这个号再没有更新过。<br><br>
    <span style="color:#999;font-size:12px">—— 那行字是谁写的，没有人知道。</span>
  </p>
