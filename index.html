<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古时今日 · 公众号</title>
<link rel="stylesheet" href="css/wechat.css?v=20260908">
<link rel="stylesheet" href="css/vintage.css?v=20260908">
</head>
<body>

<header class="wx-top">古时今日
  <span class="wx-top-actions">···</span>
</header>

<!-- 公众号头卡 -->
<section class="wx-hero">
  <div class="wx-avatar-row">
    <div class="wx-avatar">古</div>
    <div class="wx-name-row">
      <h1 class="wx-name">古时今日</h1>
      <button class="wx-follow" id="follow-btn">+ 关注</button>
    </div>
  </div>
  <p class="wx-desc">守护文物的无名者们 · 2018 年停更，感谢曾经的关注</p>
  <div class="wx-stats"><span><b>原创</b> 5 篇</span><span><b>粉丝</b> 3,012</span></div>
</section>

<div class="wx-notice"><i>⚠</i> 该公众号已长期未登录 · 最后登录时间：2018-01-02</div>

<!-- 自定义菜单 -->
<nav class="wechat-menu">
  <a data-act="history">历史消息</a>
  <a data-act="toc">目录</a>
  <a data-act="msg">留言板</a>
</nav>

<!-- 历史消息 -->
<section class="wx-articles">
  <div class="sec-title">历史消息</div>
  <div id="article-list"></div>
</section>

<!-- 往期留言墙 -->
<section class="wx-msgwall" id="msgwall">
  <div class="sec-title">往期留言</div>

  <div class="msg-old">
    <div class="msg-meta">游客 202205 · 2017-11-03 22:41</div>
    <div class="msg-text">请问这个号还收投稿吗？想报名做志愿者。</div>
  </div>
  <div class="msg-old">
    <div class="msg-meta">过客 · 2018-03-11 01:07</div>
    <div class="msg-text">我还会再回来看看的。谢谢你们让我知道这些老物件。</div>
  </div>
  <div class="msg-old">
    <div class="msg-meta">匿名 · 2018-06-30 04:12</div>
    <div class="msg-text">有人吗？我把那幅画的照片发到后台了，怕弄丢……有人吗？</div>
  </div>

  <div class="msg-send-row">
    <input class="msg-input-box" placeholder="写下你的留言…" disabled>
    <button class="msg-send" id="msgwall-send">发送</button>
  </div>
</section>

<footer class="wx-footer">该公众号已停更 · 最后推送：2018-06-30</footer>

<script src="js/dialog.js?v=20260908"></script>
<script src="js/posts.js?v=20260908"></script>
<script src="js/story.js?v=20260908"></script>
<script src="js/app.js?v=20260908"></script>
</body>
</html>
