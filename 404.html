<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>404 - 古时今日</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/vintage.css">
</head>
<body class="err404">

<div class="err404-wrap">
  <div class="v98-window static">
    <div class="v98-titlebar">
      <span class="v98-title">错误 - 古时今日</span>
      <span class="v98-close" onclick="location.href='index.html'">✕</span>
    </div>
    <div class="v98-body">
      <div class="v98-msg">
        <div class="v98-icon error">✕</div>
        <div class="v98-text">
          页面不存在（错误 404）。
          您访问的页面可能已被删除、转移，或从未存在过。该站在 2018 年 1 月后停止维护，
          <b>本站部分内容已永久丢失</b>。
        </div>
      </div>
      <div class="v98-btns">
        <button class="v98-btn" onclick="location.href='index.html'">返回论坛</button>
        <button class="v98-btn pressed" onclick="history.length>1?history.back():location.href='index.html'">后退</button>
      </div>
    </div>
  </div>

  <div class="err404-hint">
    <p>· 你想找的那页，也许曾在 2016–2017 年存在过。如今只剩链接还活着。</p>
    <p>· 有人在站里留下过一张旧照片，藏在某位守护者的相册里。如果你找到了它，请记住照片后面的那栋楼。</p>
    <p>· 你知道"古时今日"是什么意思吗？老站长说，答案写在源代码里。</p>
  </div>

  <div class="err404-stats">
    <div class="v98-window static">
      <div class="v98-titlebar"><span class="v98-title">连接状态</span></div>
      <div class="v98-body">
        <div class="v98-msg">
          <div class="v98-icon warn">!</div>
          <div class="v98-text">
            服务器：<span style="color:#888">离线</span> · 最后在线：2018-01-01<br>
            数据包：已丢失 61 个 · 已恢复 18 个<br>
            本站没有留下"网管"，也不会有回复。
          </div>
        </div>
        <div class="v98-btns">
          <button class="v98-btn" onclick="location.href='guardian.html?id=1'">去找那张照片</button>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
